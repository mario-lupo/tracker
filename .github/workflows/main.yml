name: Pokemon Portfolio Tracker

on:
  schedule:
    # Esegue ogni giorno alle 03:00 UTC (04:00 o 05:00 in Italia a seconda dell'ora legale)
    - cron: '0 3 * * *'
  workflow_dispatch: # Ti permette di avviarlo anche manualmente con un click

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo script
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python tracker.py
